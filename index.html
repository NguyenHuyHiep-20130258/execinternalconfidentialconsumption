<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Đối chiếu hóa chất</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* layout: one small sign-in card on the page background */
  --bg: #f1f4f5; --panel: #ffffff; --ink: #16222a; --muted: #5a6a74; --line: #d9e0e4;
  --accent: #0b6b73; --accent-ink: #ffffff; --bad: #b3261e; --bad-bg: #fbe0dd;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #11181c; --panel: #192227; --ink: #e5edf0; --muted: #94a4ad; --line: #2b373e;
    --accent: #4fbfc6; --accent-ink: #062226; --bad: #ff8d84; --bad-bg: #411c19; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
form { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
h1 { margin: 0; font-size: 20px; font-weight: 600; text-wrap: balance; }
p { margin: 0; color: var(--muted); font-size: 13px; }
label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
input { font: 16px var(--f-num); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: 600 15px var(--f-body); background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 10px 14px; cursor: pointer; }
button[disabled] { opacity: .6; cursor: wait; }
.err { color: var(--bad); background: var(--bad-bg); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
</style>
</head>
<body>
<form id="gate" autocomplete="off">
  <h1>Đối chiếu hóa chất</h1>
  <p>Trang nội bộ của phòng pha keo F1 / F2. Nhập mật khẩu để mở.</p>
  <label for="pw">Mật khẩu<input id="pw" type="password" required autofocus></label>
  <div class="err" id="err" role="alert" hidden>Sai mật khẩu. Kiểm tra lại rồi thử lần nữa.</div>
  <button id="go" type="submit">Mở trang</button>
</form>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toB64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));
async function keyFrom(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iter },
    base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
async function unlock(key) {
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.ct));
  try { sessionStorage.setItem('hc-key-' + PAYLOAD.salt, toB64(await crypto.subtle.exportKey('raw', key))); } catch (e) { /* ignore */ }
  const html = new TextDecoder().decode(plain);
  document.open(); document.write(html); document.close();
}
(async () => {
  try {
    const saved = sessionStorage.getItem('hc-key-' + PAYLOAD.salt);
    if (saved) await unlock(await crypto.subtle.importKey('raw', b64(saved), 'AES-GCM', true, ['decrypt']));
  } catch (e) { try { sessionStorage.removeItem('hc-key-' + PAYLOAD.salt); } catch (x) { /* ignore */ } }
})();
document.getElementById('gate').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('go'), err = document.getElementById('err');
  btn.disabled = true; btn.textContent = 'Đang mở…'; err.hidden = true;
  try { await unlock(await keyFrom(document.getElementById('pw').value)); }
  catch (x) { err.hidden = false; btn.disabled = false; btn.textContent = 'Mở trang'; document.getElementById('pw').select(); }
});
</script>
